<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B4DFF"/>
      <stop offset="100%" style="stop-color:#00B8FF"/>
    </linearGradient>
    
    <!-- Glowing effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Randomly Positioned Nodes -->
  <g id="random-nodes">
    <!-- Top Section -->
    <circle cx="120" cy="80" r="8" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="280" cy="90" r="10" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="4s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="180" cy="60" r="6" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.5s" repeatCount="indefinite" begin="1.1s"/>
    </circle>

    <!-- Right Section -->
    <circle cx="340" cy="180" r="9" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="9;11;9" dur="4.2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="320" cy="280" r="7" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="7;9;7" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="350" cy="120" r="6" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.3s" repeatCount="indefinite" begin="0.9s"/>
    </circle>

    <!-- Bottom Section -->
    <circle cx="140" cy="320" r="8" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="8;10;8" dur="3.7s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="260" cy="340" r="10" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="4.1s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="200" cy="350" r="7" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="7;9;7" dur="3.4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Left Section -->
    <circle cx="60" cy="160" r="9" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="9;11;9" dur="3.9s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="80" cy="240" r="6" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.6s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle cx="50" cy="300" r="8" fill="url(#nodeGradient)" filter="url(#glow)">
      <animate attributeName="r" values="8;10;8" dur="4.3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>

    <!-- Small Random Nodes -->
    <circle cx="150" cy="150" r="4" fill="url(#nodeGradient)" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="140" r="4" fill="url(#nodeGradient)" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="270" cy="250" r="4" fill="url(#nodeGradient)" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.6s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="130" cy="260" r="4" fill="url(#nodeGradient)" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.7s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- Connection Lines -->
  <g id="connections" stroke="url(#nodeGradient)" stroke-width="1" opacity="0.2">
    <!-- Random Connections -->
    <path d="M 120 80 L 180 60">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 280 90 L 350 120">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M 340 180 L 320 280">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.4s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    <path d="M 260 340 L 200 350">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.1s" repeatCount="indefinite" begin="0.9s"/>
    </path>
    <path d="M 60 160 L 80 240">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.3s" repeatCount="indefinite" begin="1.2s"/>
    </path>
    <path d="M 150 150 L 250 140">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
    </path>
    <path d="M 270 250 L 130 260">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.6s" repeatCount="indefinite" begin="0.4s"/>
    </path>
  </g>
</svg> 