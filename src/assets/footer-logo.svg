<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&amp;display=swap');
    </style>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="nodeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="nodeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="nodeGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A5B4FC"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <!-- Add shimmer animation -->
    <linearGradient id="flowShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6; stop-opacity: 1">
        <animate attributeName="offset" values="-1; 1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#60A5FA; stop-opacity: 1">
        <animate attributeName="offset" values="-0.5; 1.5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#3B82F6; stop-opacity: 1">
        <animate attributeName="offset" values="0; 2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10,10) scale(0.75)">
    <!-- Background Circle -->
    <circle cx="40" cy="40" r="38" fill="url(#flowGradient)" fill-opacity="0.1" />
    
    <!-- Flow Pattern -->
    <path d="M20 40C20 28.954 28.954 20 40 20C51.046 20 60 28.954 60 40C60 51.046 51.046 60 40 60"
      stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite"/>
    </path>
    
    <!-- Neural Network Nodes -->
    <circle cx="40" cy="20" r="4" fill="url(#nodeGradient1)">
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="4" fill="url(#nodeGradient2)">
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="40" cy="60" r="4" fill="url(#nodeGradient3)">
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="20" cy="40" r="4" fill="url(#nodeGradient1)">
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    
    <!-- Center Icon -->
    <circle cx="40" cy="40" r="6" fill="url(#flowGradient)"/>
    <path d="M40 32V28M40 52V48M48 40H52M28 40H32" stroke="url(#flowGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text "BasiraFlow" -->
  <g>
    <text x="90" y="48" font-family="Poppins, sans-serif" font-weight="600" font-size="32">
      <tspan fill="#1E293B">Basira</tspan><tspan fill="url(#flowShimmer)">Flow</tspan>
    </text>
  </g>
  
  <!-- Connecting Flow Element -->
  <path d="M75 40 Q 82 40 88 40" 
        stroke="url(#flowGradient)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6">
    <animate attributeName="d" 
             values="M75 40 Q 82 40 88 40;M75 40 Q 82 38 88 40;M75 40 Q 82 42 88 40;M75 40 Q 82 40 88 40" 
             dur="4s" 
             repeatCount="indefinite"/>
  </path>
</svg>
