<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="flowGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B4DFF"/>
      <stop offset="100%" style="stop-color:#00B8FF"/>
    </linearGradient>
    <linearGradient id="flowGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9061FF"/>
      <stop offset="100%" style="stop-color:#33C9FF"/>
    </linearGradient>
    <linearGradient id="flowGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A375FF"/>
      <stop offset="100%" style="stop-color:#66D9FF"/>
    </linearGradient>
  </defs>

  <!-- Flow Lines Group -->
  <g>
    <!-- Multiple Flow Lines with increased waviness -->
    <path d="M 50 100 
             C 150 80, 250 120, 350 80 
             C 450 40, 550 120, 750 60" 
          stroke="url(#flowGradient1)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.8">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 80, 250 120, 350 80 C 450 40, 550 120, 750 60;
                 M 50 100 C 150 90, 250 130, 350 90 C 450 50, 550 130, 750 70;
                 M 50 100 C 150 80, 250 120, 350 80 C 450 40, 550 120, 750 60"
               dur="6s" 
               repeatCount="indefinite"/>
    </path>

    <path d="M 50 100 
             C 150 120, 250 80, 350 120 
             C 450 160, 550 80, 750 140" 
          stroke="url(#flowGradient2)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.7">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 120, 250 80, 350 120 C 450 160, 550 80, 750 140;
                 M 50 100 C 150 130, 250 90, 350 130 C 450 170, 550 90, 750 150;
                 M 50 100 C 150 120, 250 80, 350 120 C 450 160, 550 80, 750 140"
               dur="7s" 
               repeatCount="indefinite"
               begin="0.2s"/>
    </path>

    <path d="M 50 100 
             C 150 60, 250 140, 350 60 
             C 450 20, 550 140, 750 40" 
          stroke="url(#flowGradient3)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.6">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 60, 250 140, 350 60 C 450 20, 550 140, 750 40;
                 M 50 100 C 150 70, 250 150, 350 70 C 450 30, 550 150, 750 50;
                 M 50 100 C 150 60, 250 140, 350 60 C 450 20, 550 140, 750 40"
               dur="6.5s" 
               repeatCount="indefinite"
               begin="0.4s"/>
    </path>

    <path d="M 50 100 
             C 150 140, 250 60, 350 140 
             C 450 180, 550 60, 750 160" 
          stroke="url(#flowGradient1)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.5">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 140, 250 60, 350 140 C 450 180, 550 60, 750 160;
                 M 50 100 C 150 150, 250 70, 350 150 C 450 190, 550 70, 750 170;
                 M 50 100 C 150 140, 250 60, 350 140 C 450 180, 550 60, 750 160"
               dur="7.5s" 
               repeatCount="indefinite"
               begin="0.6s"/>
    </path>

    <!-- Additional wavy lines -->
    <path d="M 50 100 
             C 150 40, 250 160, 350 40 
             C 450 0, 550 160, 750 20" 
          stroke="url(#flowGradient2)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.4">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 40, 250 160, 350 40 C 450 0, 550 160, 750 20;
                 M 50 100 C 150 50, 250 170, 350 50 C 450 10, 550 170, 750 30;
                 M 50 100 C 150 40, 250 160, 350 40 C 450 0, 550 160, 750 20"
               dur="8s" 
               repeatCount="indefinite"
               begin="0.8s"/>
    </path>

    <path d="M 50 100 
             C 150 160, 250 40, 350 160 
             C 450 200, 550 40, 750 180" 
          stroke="url(#flowGradient3)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.3">
      <animate attributeName="d" 
               values="
                 M 50 100 C 150 160, 250 40, 350 160 C 450 200, 550 40, 750 180;
                 M 50 100 C 150 170, 250 50, 350 170 C 450 210, 550 50, 750 190;
                 M 50 100 C 150 160, 250 40, 350 160 C 450 200, 550 40, 750 180"
               dur="7.8s" 
               repeatCount="indefinite"
               begin="1s"/>
    </path>

    <!-- More waves with different frequencies -->
    <path d="M 50 100 
             C 125 70, 200 130, 275 70 
             C 350 10, 425 130, 500 70
             C 575 10, 650 130, 750 50" 
          stroke="url(#flowGradient1)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.4">
      <animate attributeName="d" 
               values="
                 M 50 100 C 125 70, 200 130, 275 70 C 350 10, 425 130, 500 70 C 575 10, 650 130, 750 50;
                 M 50 100 C 125 80, 200 140, 275 80 C 350 20, 425 140, 500 80 C 575 20, 650 140, 750 60;
                 M 50 100 C 125 70, 200 130, 275 70 C 350 10, 425 130, 500 70 C 575 10, 650 130, 750 50"
               dur="8.5s" 
               repeatCount="indefinite"
               begin="0.3s"/>
    </path>

    <path d="M 50 100 
             C 125 130, 200 70, 275 130 
             C 350 190, 425 70, 500 130
             C 575 190, 650 70, 750 150" 
          stroke="url(#flowGradient2)" 
          stroke-width="1.5" 
          fill="none"
          opacity="0.35">
      <animate attributeName="d" 
               values="
                 M 50 100 C 125 130, 200 70, 275 130 C 350 190, 425 70, 500 130 C 575 190, 650 70, 750 150;
                 M 50 100 C 125 140, 200 80, 275 140 C 350 200, 425 80, 500 140 C 575 200, 650 80, 750 160;
                 M 50 100 C 125 130, 200 70, 275 130 C 350 190, 425 70, 500 130 C 575 190, 650 70, 750 150"
               dur="7.2s" 
               repeatCount="indefinite"
               begin="0.7s"/>
    </path>

    <!-- Data Points -->
    <g class="data-points">
      <circle cx="200" cy="100" r="1.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="90" r="1.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="400" cy="85" r="1.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="500" cy="80" r="1.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="600" cy="75" r="1.5" fill="#60A5FA">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="300" cy="106" r="1.5" fill="#7B4DFF">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="400" cy="105" r="1.5" fill="#7B4DFF">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <circle cx="500" cy="104" r="1.5" fill="#7B4DFF">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
    </g>
  </g>
</svg> 